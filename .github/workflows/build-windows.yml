name: Windows build and diagnostics
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite'
  VCPKG_DOWNLOADS: '${{ github.workspace }}/.cache/downloads'
  SCCACHE_DIR: '${{ github.workspace }}/.cache/sccache'
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_BASEDIRS: '${{ github.workspace }}'
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-release, windows-debug]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@v3.31.6
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Environment and dependency identity
        id: identity
        run: |
          New-Item -ItemType Directory -Force build/diagnostics,.cache/vcpkg,.cache/downloads | Out-Null
          $baseline=(Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw "Invalid vcpkg baseline" }
          $compiler=(Get-Item (Get-Command cl.exe).Source).VersionInfo.FileVersion
          "baseline=$baseline" >> $env:GITHUB_OUTPUT
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
          @("commit=$env:GITHUB_SHA","runner=$env:ImageOS/$env:ImageVersion","compiler=$compiler","preset=${{ matrix.preset }}") | Set-Content build/diagnostics/environment.txt
          cmake --version >> build/diagnostics/environment.txt
          ninja --version >> build/diagnostics/environment.txt
          sccache --version >> build/diagnostics/environment.txt
          sccache --stop-server *> $null
          sccache --start-server
          if ($LASTEXITCODE -eq 0) {
            "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV
            "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV
          }
          exit 0
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: .cache/vcpkg
          key: deps-v1-${{ runner.os }}-${{ matrix.preset }}-${{ steps.identity.outputs.compiler }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-ports/**') }}
          restore-keys: deps-v1-${{ runner.os }}-${{ matrix.preset }}-${{ steps.identity.outputs.compiler }}-
      - uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: downloads-v1-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: downloads-v1-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        id: compiler
        with:
          path: .cache/sccache
          key: compiler-v1-${{ runner.os }}-${{ matrix.preset }}-${{ steps.identity.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: compiler-v1-${{ runner.os }}-${{ matrix.preset }}-${{ steps.identity.outputs.compiler }}-
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          fetch-depth: 0
          ref: ${{ steps.identity.outputs.baseline }}
          path: .tools/vcpkg
          persist-credentials: false
      - name: Bootstrap vcpkg
        run: |
          & .tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/.tools/vcpkg" >> $env:GITHUB_ENV
      - name: Configure
        id: configure
        run: |
          ./ci/RunBuildStage.ps1 -Name configure -FilePath cmake -CommandArguments @("--preset","${{ matrix.preset }}","-DBUILD_TESTS=ON","-DTOGGLE_BIN_FOLDER=ON","-DOPTIONS_ENABLE_SCCACHE=OFF")
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.configure.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' }}
        with:
          path: .cache/vcpkg
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Compile
        run: |
          ./ci/RunBuildStage.ps1 -Name compile -FilePath cmake -CommandArguments @("--build","build/${{ matrix.preset }}","--parallel","2")
      - name: Unit tests
        run: |
          ./ci/RunBuildStage.ps1 -Name tests -FilePath ctest -CommandArguments @("--test-dir","build/${{ matrix.preset }}/tests","--output-on-failure","--no-tests=error","--timeout","120","--output-junit","$env:GITHUB_WORKSPACE/build/diagnostics/tests.xml","-R","^unit$")
      - name: Capture compiler statistics and configuration
        if: always()
        run: |
          sccache --show-stats | Tee-Object build/diagnostics/compiler-cache.txt
          sccache --stop-server
          $folder="build/${{ matrix.preset }}"
          foreach ($name in @("CMakeCache.txt","vcpkg-manifest-install.log","CMakeFiles/CMakeConfigureLog.yaml")) {
            $file=Join-Path $folder $name
            if (Test-Path $file) { Copy-Item $file build/diagnostics/ }
          }
          exit 0
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        with:
          path: .cache/sccache
          key: ${{ steps.compiler.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.preset }}-${{ github.run_attempt }}
          path: build/diagnostics
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/bin/*.exe
            build/${{ matrix.preset }}/bin/*.dll
            build/${{ matrix.preset }}/bin/*.pdb
          if-no-files-found: error
          retention-days: 14
