name: Windows build and diagnostics
'on':
  push:
    branches:
    - main
    - ci/**
  pull_request: null
  workflow_dispatch:
    inputs:
      preset:
        description: Build both configurations, or select one for a focused validation
        type: choice
        required: true
        default: both
        options:
        - both
        - windows-release
        - windows-debug
        - windows-debug-cache
        - windows-release-cache
        - windows-debug-cache-unity
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.preset || 'both' }}
  cancel-in-progress: true
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/downloads
  SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_BASEDIRS: ${{ github.workspace }}
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ github.event_name == 'workflow_dispatch' && inputs.preset != 'both' && fromJSON(format('["{0}"]', inputs.preset)) || fromJSON('["windows-release",
          "windows-debug"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: ilammy/msvc-dev-cmd@v1
    - uses: lukka/get-cmake@v3.31.6
    - uses: mozilla-actions/sccache-action@v0.0.9
    - name: Environment and dependency identity
      id: identity
      run: "New-Item -ItemType Directory -Force build/diagnostics,.cache/vcpkg,.cache/downloads | Out-Null\n$baseline=(Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'\n\
        if ($baseline -notmatch '^[0-9a-f]{40}$') { throw \"Invalid vcpkg baseline\" }\n$compiler=(Get-Item (Get-Command cl.exe).Source).VersionInfo.FileVersion\n\
        \"baseline=$baseline\" >> $env:GITHUB_OUTPUT\n$dependencyPreset=\"${{ matrix.preset }}\" -replace \"-unity$\",\"\" -replace \"-cache$\",\"\"\n\"\
        dependency-preset=$dependencyPreset\" >> $env:GITHUB_OUTPUT\n\"compiler=$compiler\" >> $env:GITHUB_OUTPUT\n@(\"commit=$env:GITHUB_SHA\",\"runner=$env:ImageOS/$env:ImageVersion\"\
        ,\"compiler=$compiler\",\"preset=${{ matrix.preset }}\") | Set-Content build/diagnostics/environment.txt\n\"processors=$([Environment]::ProcessorCount)\"\
        \ >> build/diagnostics/environment.txt\ncmake --version >> build/diagnostics/environment.txt\nninja --version >> build/diagnostics/environment.txt\n\
        sccache --version >> build/diagnostics/environment.txt\nsccache --stop-server 2>&1 | Out-Null\n$env:SCCACHE_ERROR_LOG=\"$env:GITHUB_WORKSPACE/build/diagnostics/sccache-errors.log\"\
        \n$env:SCCACHE_LOG=\"warn\"\nsccache --start-server\nif ($LASTEXITCODE -eq 0) {\n  \"CMAKE_C_COMPILER_LAUNCHER=sccache\" >> $env:GITHUB_ENV\n  \"\
        CMAKE_CXX_COMPILER_LAUNCHER=sccache\" >> $env:GITHUB_ENV\n}\nexit 0\n"
      env:
        ACTIONS_RUNTIME_TOKEN: ''
        ACTIONS_RESULTS_URL: ''
    - uses: actions/cache/restore@v4
      id: dependencies
      with:
        path: .cache/vcpkg
        key: deps-v1-${{ runner.os }}-${{ steps.identity.outputs.dependency-preset }}-${{ steps.identity.outputs.compiler }}-${{ hashFiles('vcpkg.json',
          'CMakePresets.json', 'cmake/vcpkg-ports/**') }}
        restore-keys: 'deps-v1-${{ runner.os }}-${{ steps.identity.outputs.dependency-preset }}-${{ steps.identity.outputs.compiler }}-

          deps-partial-v1-${{ runner.os }}-${{ steps.identity.outputs.dependency-preset }}-${{ steps.identity.outputs.compiler }}-

          '
    - uses: actions/cache/restore@v4
      with:
        path: .cache/downloads
        key: downloads-v1-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: downloads-v1-${{ runner.os }}-
      id: downloads
    - uses: actions/cache/restore@v4
      id: compiler
      with:
        path: .cache/sccache
        key: compiler-v1-${{ runner.os }}-${{ matrix.preset }}-${{ steps.identity.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: compiler-v1-${{ runner.os }}-${{ matrix.preset }}-${{ steps.identity.outputs.compiler }}-
    - uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: ${{ steps.identity.outputs.baseline }}
        path: .tools/vcpkg
        persist-credentials: false
        fetch-depth: 0
    - name: Bootstrap vcpkg
      run: '& .tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        "VCPKG_ROOT=$env:GITHUB_WORKSPACE/.tools/vcpkg" >> $env:GITHUB_ENV

        '
      env:
        ACTIONS_RUNTIME_TOKEN: ''
        ACTIONS_RESULTS_URL: ''
    - name: Configure
      id: configure
      run: './ci/RunBuildStage.ps1 -Name configure -FilePath cmake -CommandArguments @("--preset","${{ matrix.preset }}","-DBUILD_TESTS=ON","-DTOGGLE_BIN_FOLDER=ON","-DOPTIONS_ENABLE_SCCACHE=OFF")

        '
      env:
        ACTIONS_RUNTIME_TOKEN: ''
        ACTIONS_RESULTS_URL: ''
    - uses: actions/cache/save@v4
      if: ${{ !cancelled() && steps.configure.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' }}
      with:
        path: .cache/vcpkg
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
    - name: Compile
      run: './ci/RunBuildStage.ps1 -Name compile -FilePath cmake -CommandArguments @("--build","build/${{ matrix.preset }}","--parallel","2")

        '
      env:
        ACTIONS_RUNTIME_TOKEN: ''
        ACTIONS_RESULTS_URL: ''
    - name: Unit tests
      run: './ci/RunBuildStage.ps1 -Name tests -FilePath ctest -CommandArguments @("--test-dir","build/${{ matrix.preset }}/tests","--output-on-failure","--no-tests=error","--timeout","120","--output-junit","$env:GITHUB_WORKSPACE/build/diagnostics/tests.xml","-R","^unit$")

        '
      env:
        ACTIONS_RUNTIME_TOKEN: ''
        ACTIONS_RESULTS_URL: ''
    - name: Preserve completed dependency packages after a configuration failure
      if: ${{ !cancelled() && steps.configure.outcome == 'failure' && steps.dependencies.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: .cache/vcpkg
        key: deps-partial-v1-${{ runner.os }}-${{ steps.identity.outputs.dependency-preset }}-${{ steps.identity.outputs.compiler }}-${{ github.run_id }}-${{
          github.run_attempt }}
    - name: Preserve verified source downloads
      if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: .cache/downloads
        key: ${{ steps.downloads.outputs.cache-primary-key }}
    - name: Capture compiler statistics and configuration
      if: always()
      run: "sccache --show-stats | Tee-Object build/diagnostics/compiler-cache.txt\nsccache --stop-server\n$folder=\"build/${{ matrix.preset }}\"\nforeach\
        \ ($name in @(\"CMakeCache.txt\",\"vcpkg-manifest-install.log\",\"CMakeFiles/CMakeConfigureLog.yaml\")) {\n  $file=Join-Path $folder $name\n  if\
        \ (Test-Path $file) { Copy-Item $file build/diagnostics/ }\n}\npython ./ci/SummarizeBuild.py $folder build/diagnostics/build-metrics.json\nif (Test-Path\
        \ \"$folder/.ninja_log\") { Copy-Item \"$folder/.ninja_log\" build/diagnostics/ninja.log }\nexit 0\n"
      env:
        ACTIONS_RUNTIME_TOKEN: ''
        ACTIONS_RESULTS_URL: ''
    - uses: actions/cache/save@v4
      if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
      with:
        path: .cache/sccache
        key: ${{ steps.compiler.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-${{ matrix.preset }}-${{ github.run_attempt }}
        path: build/diagnostics
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.preset }}
        path: 'build/${{ matrix.preset }}/bin/*.exe

          build/${{ matrix.preset }}/bin/*.dll

          build/${{ matrix.preset }}/bin/*.pdb

          '
        if-no-files-found: error
        retention-days: 14
